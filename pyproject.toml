[project]
name = "evo-tiktok"
version = "0.1.0"
description = "Scheduled jobs that prepare Evolution Golf's TikTok content. Drafts only; nothing is published."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2",
    "anthropic>=1.11",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evo_tiktok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
