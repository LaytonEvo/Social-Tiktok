[project]
name = "evo-tiktok"
version = "0.1.0"
description = "Scheduled jobs that prepare Evolution Golf's TikTok content. Nothing is published without Layton's approval."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2",
    "anthropic>=1.11",
    "fpdf2>=2.8",
    "google-auth>=2.30",
    "requests>=2.31",
    "Pillow>=10",
    "imageio-ffmpeg>=0.5",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evo_tiktok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
